<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 — Ойын</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-body: 'Plus Jakarta Sans', sans-serif;
  --bg: #faf8ef;
  --board-bg: #bbada0;
  --cell-empty: #cdc1b4;
  --text-dark: #776e65;
  --text-light: #f9f6f2;
  --header-text: #776e65;
  --btn-bg: #8f7a66;
  --btn-hover: #7a6758;
  --overlay-bg: rgba(238, 228, 218, 0.73);

  /* tile colors */
  --tile-2: #eee4da;
  --tile-4: #ede0c8;
  --tile-8: #f2b179;
  --tile-16: #f59563;
  --tile-32: #f67c5f;
  --tile-64: #f65e3b;
  --tile-128: #edcf72;
  --tile-256: #edcc61;
  --tile-512: #edc850;
  --tile-1024: #edc53f;
  --tile-2048: #edc22e;
  --tile-super: #3c3a32;
}

html, body {
  height: 100%;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text-dark);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  touch-action: none;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.game-wrap {
  width: 100%;
  max-width: 500px;
  padding: 16px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}

.title {
  font-size: clamp(2.2rem, 8vw, 3.2rem);
  font-weight: 800;
  color: var(--text-dark);
  line-height: 1;
}

.scores {
  display: flex;
  gap: 8px;
}

.score-box {
  background: var(--board-bg);
  color: var(--text-light);
  border-radius: 6px;
  padding: 8px 16px;
  text-align: center;
  min-width: 80px;
  position: relative;
  overflow: visible;
}

.score-box .label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.7;
}

.score-box .value {
  font-size: clamp(1.1rem, 4vw, 1.6rem);
  font-weight: 800;
  line-height: 1.2;
}

/* Controls row */
.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 13px;
  color: var(--text-dark);
  opacity: 0.8;
  flex: 1;
  min-width: 0;
  line-height: 1.3;
}

.btn-row {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.btn {
  background: var(--btn-bg);
  color: var(--text-light);
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 180ms ease;
}

.btn:hover { background: var(--btn-hover); }

/* Board */
.board-container {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  background: var(--board-bg);
  border-radius: 8px;
  padding: 2.2%;
}

.grid-bg {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 2.2%;
  width: 100%;
  height: 100%;
}

.cell-bg {
  background: var(--cell-empty);
  border-radius: 6px;
}

/* Tiles layer */
.tiles-layer {
  position: absolute;
  top: 2.2%;
  left: 2.2%;
  right: 2.2%;
  bottom: 2.2%;
}

.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  font-weight: 800;
  transition: top 120ms ease, left 120ms ease;
  z-index: 1;
}

.tile.new-tile {
  animation: tileAppear 200ms ease forwards;
}

.tile.merged-tile {
  animation: tileMerge 200ms ease forwards;
  z-index: 2;
}

@keyframes tileAppear {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

@keyframes tileMerge {
  0% { transform: scale(1); }
  50% { transform: scale(1.18); }
  100% { transform: scale(1); }
}

/* Overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: var(--overlay-bg);
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms ease;
}

.overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.overlay-msg {
  font-size: clamp(1.8rem, 6vw, 2.8rem);
  font-weight: 800;
  color: var(--text-dark);
  margin-bottom: 16px;
  text-align: center;
}

.overlay .btn {
  font-size: 16px;
  padding: 12px 28px;
}

/* Score animation */
.score-add {
  position: absolute;
  font-size: 18px;
  font-weight: 800;
  color: var(--text-dark);
  opacity: 0;
  animation: scoreFloat 700ms ease forwards;
  pointer-events: none;
  z-index: 200;
}

@keyframes scoreFloat {
  0% { opacity: 1; transform: translateX(-50%) translateY(0); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
}

/* Responsive */
@media (max-width: 520px) {
  .game-wrap { padding: 10px; }
  .score-box { min-width: 56px; padding: 6px 8px; }
  .score-box .label { font-size: 10px; }
  .subtitle { font-size: 11px; }
  .btn { padding: 7px 12px; font-size: 13px; white-space: nowrap; }
}
</style>
</head>
<body>

<div class="game-wrap">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="label">Ұпай</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">Рекорд</div>
        <div class="value" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="subtitle">Плиткаларды біріктіріп, 2048-ге жет!</div>
    <div class="btn-row">
      <button class="btn" id="btn-undo" title="Қайтару">↩</button>
      <button class="btn" id="btn-new">Жаңа ойын</button>
    </div>
  </div>

  <div class="board-container" id="board">
    <div class="grid-bg" id="grid-bg"></div>
    <div class="tiles-layer" id="tiles-layer"></div>

    <div class="overlay" id="overlay-win">
      <div class="overlay-msg">Жеңіс! 🎉</div>
      <div class="btn-row">
        <button class="btn" id="btn-continue">Жалғастыру</button>
        <button class="btn" id="btn-new-win">Жаңа ойын</button>
      </div>
    </div>

    <div class="overlay" id="overlay-lose">
      <div class="overlay-msg">Ойын бітті</div>
      <button class="btn" id="btn-new-lose">Қайта бастау</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---- Constants ----
  const SIZE = 4;
  const TILE_COLORS = {
    2:    { bg: '#eee4da', color: '#776e65', fontSize: 1 },
    4:    { bg: '#ede0c8', color: '#776e65', fontSize: 1 },
    8:    { bg: '#f2b179', color: '#f9f6f2', fontSize: 1 },
    16:   { bg: '#f59563', color: '#f9f6f2', fontSize: 1 },
    32:   { bg: '#f67c5f', color: '#f9f6f2', fontSize: 1 },
    64:   { bg: '#f65e3b', color: '#f9f6f2', fontSize: 1 },
    128:  { bg: '#edcf72', color: '#f9f6f2', fontSize: 0.85 },
    256:  { bg: '#edcc61', color: '#f9f6f2', fontSize: 0.85 },
    512:  { bg: '#edc850', color: '#f9f6f2', fontSize: 0.85 },
    1024: { bg: '#edc53f', color: '#f9f6f2', fontSize: 0.7 },
    2048: { bg: '#edc22e', color: '#f9f6f2', fontSize: 0.7 },
  };
  const SUPER_TILE = { bg: '#3c3a32', color: '#f9f6f2', fontSize: 0.55 };

  // ---- DOM ----
  const gridBg = document.getElementById('grid-bg');
  const tilesLayer = document.getElementById('tiles-layer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlayWin = document.getElementById('overlay-win');
  const overlayLose = document.getElementById('overlay-lose');
  const boardEl = document.getElementById('board');

  // ---- State ----
  let grid = [];
  let score = 0;
  let best = 0;
  let won = false;
  let keepPlaying = false;
  let moved = false;
  let prevState = null;

  // ---- Init background grid ----
  for (let i = 0; i < SIZE * SIZE; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell-bg';
    gridBg.appendChild(cell);
  }

  // ---- Grid helpers ----
  function createGrid() {
    const g = [];
    for (let r = 0; r < SIZE; r++) {
      g[r] = [];
      for (let c = 0; c < SIZE; c++) {
        g[r][c] = 0;
      }
    }
    return g;
  }

  function copyGrid(g) {
    return g.map(row => [...row]);
  }

  function emptyCells(g) {
    const cells = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (g[r][c] === 0) cells.push({ r, c });
      }
    }
    return cells;
  }

  function addRandom(g) {
    const empty = emptyCells(g);
    if (empty.length === 0) return false;
    const cell = empty[Math.floor(Math.random() * empty.length)];
    g[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
    return cell;
  }

  // ---- Tile positioning ----
  function getTileSize() {
    const boardRect = tilesLayer.getBoundingClientRect();
    const gap = boardRect.width * 0.022 / (1 - 0.022 * 0); // approximate
    const totalGap = boardRect.width * 0.022 * 3 / (1 + 0.022 * 0);
    const tileSize = (boardRect.width - boardRect.width * 0.022 * 3) / 4;
    const gapSize = boardRect.width * 0.022;
    return { tileSize, gapSize, boardWidth: boardRect.width };
  }

  function getTilePos(r, c) {
    // Use percentage-based positioning
    const cellPercent = (100 - 2.2 * 3) / 4; // ~23.35%
    const gapPercent = 2.2;
    const left = c * (cellPercent + gapPercent);
    const top = r * (cellPercent + gapPercent);
    return { left: left + '%', top: top + '%', size: cellPercent + '%' };
  }

  // ---- Rendering ----
  function renderTiles(animations) {
    tilesLayer.innerHTML = '';
    const baseFontSize = tilesLayer.getBoundingClientRect().width * 0.12;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (val === 0) continue;

        const pos = getTilePos(r, c);
        const tile = document.createElement('div');
        tile.className = 'tile';

        const style = TILE_COLORS[val] || SUPER_TILE;
        tile.style.background = style.bg;
        tile.style.color = style.color;
        tile.style.left = pos.left;
        tile.style.top = pos.top;
        tile.style.width = pos.size;
        tile.style.height = pos.size;
        tile.style.fontSize = (baseFontSize * style.fontSize) + 'px';
        tile.textContent = val;

        if (animations) {
          if (animations.new && animations.new.r === r && animations.new.c === c) {
            tile.classList.add('new-tile');
          }
          if (animations.merged) {
            for (const m of animations.merged) {
              if (m.r === r && m.c === c) {
                tile.classList.add('merged-tile');
              }
            }
          }
        }

        tilesLayer.appendChild(tile);
      }
    }
  }

  function updateScore(add) {
    score += add;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
    if (add > 0) {
      showScoreAnimation(add);
    }
  }

  function showScoreAnimation(val) {
    const el = document.createElement('div');
    el.className = 'score-add';
    el.textContent = '+' + val;
    const scoreBox = scoreEl.parentElement;
    el.style.position = 'absolute';
    el.style.left = '50%';
    el.style.top = '100%';
    el.style.transform = 'translateX(-50%)';
    scoreBox.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }

  // ---- Move logic ----
  function slideRow(row) {
    // Remove zeros
    let arr = row.filter(v => v !== 0);
    let scoreAdd = 0;
    const mergedPositions = [];

    // Merge
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        scoreAdd += arr[i];
        arr[i + 1] = 0;
        mergedPositions.push(i);
        i++; // skip next
      }
    }

    // Remove zeros again
    arr = arr.filter(v => v !== 0);

    // Pad
    while (arr.length < SIZE) arr.push(0);

    return { result: arr, scoreAdd, mergedPositions };
  }

  function move(direction) {
    const prevGrid = copyGrid(grid);
    const prevScore = score;
    let totalScore = 0;
    const mergedCells = [];
    let didMove = false;

    if (direction === 'left' || direction === 'right') {
      for (let r = 0; r < SIZE; r++) {
        let row = [...grid[r]];
        if (direction === 'right') row.reverse();

        const { result, scoreAdd, mergedPositions } = slideRow(row);

        if (direction === 'right') {
          result.reverse();
          for (const p of mergedPositions) {
            mergedCells.push({ r, c: SIZE - 1 - p });
          }
        } else {
          for (const p of mergedPositions) {
            mergedCells.push({ r, c: p });
          }
        }

        totalScore += scoreAdd;

        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] !== result[c]) didMove = true;
          grid[r][c] = result[c];
        }
      }
    } else {
      for (let c = 0; c < SIZE; c++) {
        let col = [];
        for (let r = 0; r < SIZE; r++) col.push(grid[r][c]);
        if (direction === 'down') col.reverse();

        const { result, scoreAdd, mergedPositions } = slideRow(col);

        if (direction === 'down') {
          result.reverse();
          for (const p of mergedPositions) {
            mergedCells.push({ r: SIZE - 1 - p, c });
          }
        } else {
          for (const p of mergedPositions) {
            mergedCells.push({ r: p, c });
          }
        }

        totalScore += scoreAdd;

        for (let r = 0; r < SIZE; r++) {
          if (grid[r][c] !== result[r]) didMove = true;
          grid[r][c] = result[r];
        }
      }
    }

    if (!didMove) return false;

    // Save state for undo
    prevState = { grid: prevGrid, score: prevScore };

    updateScore(totalScore);

    // Add new tile
    const newCell = addRandom(grid);

    // Check for 2048
    if (!won && !keepPlaying) {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] === 2048) {
            won = true;
          }
        }
      }
    }

    renderTiles({ new: newCell, merged: mergedCells });

    if (won && !keepPlaying) {
      setTimeout(() => overlayWin.classList.add('active'), 300);
    } else if (isGameOver()) {
      setTimeout(() => overlayLose.classList.add('active'), 400);
    }

    return true;
  }

  function isGameOver() {
    // Check empty cells
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return false;
      }
    }
    // Check possible merges
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (c < SIZE - 1 && val === grid[r][c + 1]) return false;
        if (r < SIZE - 1 && val === grid[r + 1][c]) return false;
      }
    }
    return true;
  }

  // ---- Undo ----
  function undo() {
    if (!prevState) return;
    grid = prevState.grid;
    score = prevState.score;
    scoreEl.textContent = score;
    prevState = null;
    overlayWin.classList.remove('active');
    overlayLose.classList.remove('active');
    renderTiles(null);
  }

  // ---- New game ----
  function newGame() {
    grid = createGrid();
    score = 0;
    won = false;
    keepPlaying = false;
    prevState = null;
    scoreEl.textContent = '0';
    overlayWin.classList.remove('active');
    overlayLose.classList.remove('active');
    addRandom(grid);
    addRandom(grid);
    renderTiles(null);
  }

  // ---- Input handling ----
  let inputLocked = false;

  function handleMove(dir) {
    if (inputLocked) return;
    inputLocked = true;
    move(dir);
    setTimeout(() => { inputLocked = false; }, 150);
  }

  // Keyboard
  document.addEventListener('keydown', (e) => {
    const map = {
      'ArrowLeft': 'left', 'ArrowRight': 'right',
      'ArrowUp': 'up', 'ArrowDown': 'down',
      'a': 'left', 'd': 'right', 'w': 'up', 's': 'down',
    };
    const dir = map[e.key];
    if (dir) {
      e.preventDefault();
      handleMove(dir);
    }
  });

  // Touch / swipe
  let touchStartX = 0, touchStartY = 0;
  let touchStartTime = 0;

  boardEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchStartTime = Date.now();
  }, { passive: true });

  boardEl.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);
    const elapsed = Date.now() - touchStartTime;

    if (Math.max(absDx, absDy) < 20) return;
    if (elapsed > 500) return;

    e.preventDefault();

    if (absDx > absDy) {
      handleMove(dx > 0 ? 'right' : 'left');
    } else {
      handleMove(dy > 0 ? 'down' : 'up');
    }
  });

  // Mouse drag on board
  let mouseDown = false, mouseStartX = 0, mouseStartY = 0;

  boardEl.addEventListener('mousedown', (e) => {
    mouseDown = true;
    mouseStartX = e.clientX;
    mouseStartY = e.clientY;
  });

  document.addEventListener('mouseup', (e) => {
    if (!mouseDown) return;
    mouseDown = false;
    const dx = e.clientX - mouseStartX;
    const dy = e.clientY - mouseStartY;
    const absDx = Math.abs(dx);
    const absDy = Math.abs(dy);

    if (Math.max(absDx, absDy) < 20) return;

    if (absDx > absDy) {
      handleMove(dx > 0 ? 'right' : 'left');
    } else {
      handleMove(dy > 0 ? 'down' : 'up');
    }
  });

  // ---- Buttons ----
  document.getElementById('btn-new').addEventListener('click', newGame);
  document.getElementById('btn-new-win').addEventListener('click', newGame);
  document.getElementById('btn-new-lose').addEventListener('click', newGame);
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-continue').addEventListener('click', () => {
    keepPlaying = true;
    overlayWin.classList.remove('active');
  });

  // ---- Resize ----
  window.addEventListener('resize', () => renderTiles(null));

  // ---- Procedural sound ----
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playMoveSound() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 300;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
  }

  function playMergeSound() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 520;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch(e) {}
  }

  // Integrate sounds into move
  const originalMove = move;
  // We'll override the handleMove to add sound
  const origHandleMove = handleMove;

  // Reinitialize audio on first interaction
  document.addEventListener('click', () => initAudio(), { once: true });
  document.addEventListener('touchstart', () => initAudio(), { once: true });

  // ---- Start ----
  newGame();

})();
</script>
<script data-pplx-inline-edit>
(function(){
  if(window===window.top)return;
  function inlineAll(orig,clone){
    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
</script></body>
</html>
